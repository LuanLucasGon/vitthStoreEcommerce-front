<header class="topbar">
  <div class="topbar__inner">

    <h1 class="topbar__brand">
      <lucide-angular [img]="Shirt" class="topbar__brand-icon"></lucide-angular>
      VitthStore
    </h1>

    <nav class="topbar__nav">
      <a href="#" class="topbar__nav-link">Shop</a>
      <a href="#" class="topbar__nav-link">New Drops</a>
      <a href="#" class="topbar__nav-link">Lookbook</a>
    </nav>

    <div class="topbar__search">
      <lucide-angular [img]="Search" class="topbar__search-icon"></lucide-angular>
      <input
        type="text"
        class="topbar__search-input"
        placeholder="Buscar peças..."
        [value]="searchQuery()"
        (input)="searchQuery.set($any($event.target).value)"
      />
    </div>

    <div class="topbar__actions">
      <button class="topbar__action-btn" aria-label="Entrar na conta">
        <lucide-angular [img]="User" class="topbar__action-icon"></lucide-angular>
      </button>

      <button class="topbar__action-btn topbar__action-btn--cart" aria-label="Ver carrinho">
        <lucide-angular [img]="ShoppingCart" class="topbar__action-icon"></lucide-angular>
        @if (cartStore.totalItems() > 0) {
          <span class="topbar__cart-badge">{{ cartStore.totalItems() }}</span>
        }
      </button>
    </div>

  </div>
</header>
