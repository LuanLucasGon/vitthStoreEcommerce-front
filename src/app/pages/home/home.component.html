<main class="home-page">
  <app-hero [slides]="heroSlides" />

  <div class="home-page__content">
    <section class="drops">
      <div class="drops__header">
        <div class="drops__header-info">
          <h3 class="drops__title">New Drops</h3>
          <p class="drops__subtitle">Peças em destaque desta temporada</p>
        </div>
        <p-button label="Ver tudo" [text]="true" icon="pi pi-arrow-right" iconPos="right" severity="secondary"></p-button>
      </div>

      @if (featuredQuery.isPending()) {
        <div class="drops__skeleton-grid">
          @for (_ of [1, 2, 3]; track $index) {
            <div class="drops__skeleton-item"></div>
          }
        </div>
      }

      @if (featuredQuery.isError()) {
        <p class="drops__error">Erro ao carregar produtos. Tente novamente.</p>
      }

      @if (featuredQuery.isSuccess()) {
        <div class="drops__grid">
          @for (product of featuredQuery.data(); track product.id) {
            <app-product-card
              [product]="product"
              (addToCart)="onAddToCart($event)"
            />
          }
        </div>
      }
    </section>
  </div>
</main>
